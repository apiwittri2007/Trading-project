name: Backtest

on:
  workflow_dispatch: {}
  schedule:
    - cron: "13 6 1 * *"   # monthly refresh

permissions:
  contents: write

concurrency:
  group: trading-state
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tradebot backtest
      - name: Commit backtest results
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state/backtest.json docs/data.json
          git diff --cached --quiet || git commit -m "Backtest $(date -u +%Y-%m-%d)"
          git push
