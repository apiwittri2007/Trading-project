name: Daily trading run

on:
  schedule:
    - cron: "37 21 * * 1-5"   # 21:37 UTC Mon-Fri, after the US close (orders queue for next open)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Screen, manage exits, rebalance
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m tradebot run
      - name: Commit updated state and dashboard data
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state docs/data.json
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git push
